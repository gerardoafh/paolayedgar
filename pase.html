<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#69734c">
  <title>Tu pase · Paola y Edgar</title>
  <link rel="stylesheet" href="invitacion.css">
  <link rel="stylesheet" href="pase.css">
</head>
<body class="pagina-pase">
  <main>
    <p class="eyebrow">Paola y Edgar · Nuestra boda</p>
    <h1>Tu pase personal</h1>
    <p id="estado-pase" role="status">Consultando tu pase…</p>
    <img id="imagen-pase" hidden alt="Pase digital personalizado para la boda de Paola y Edgar">
    <div class="botones-pase">
      <button id="descargar-pase" class="btn" type="button" hidden>Descargar pase</button>
      <button id="compartir-pase" class="btn secundario" type="button" hidden>Compartir pase</button>
    </div>
    <p id="ayuda-pase" class="ayuda" hidden>Se guarda como imagen PNG. Conserva tu pase para el día de la boda. En iPhone también puedes mantener pulsada la imagen y elegir Guardar en Fotos.</p>
    <a class="volver" href="/">Volver a la invitación</a>
  </main>
  <script src="pase.js" defer></script>
</body>
</html>
