<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#414c32">
  <title>Pase de grupo · Paola y Edgar</title>
  <link rel="stylesheet" href="invitacion.css">
  <link rel="stylesheet" href="pase.css">
</head>
<body class="pagina-pase">
<main>
  <p class="eyebrow">Paola y Edgar · Nuestra boda</p>
  <h1>Tu pase de grupo</h1>
  <p id="estado-pase" role="status">Consultando tu pase…</p>
  <img id="imagen-pase" hidden alt="">
  <div class="botones-pase">
    <a id="descargar-grupo" class="btn" hidden>Descargar pase PNG</a>
    <button id="compartir-grupo" class="btn secundario" type="button" hidden>Compartir imagen</button>
  </div>
  <p class="ayuda" id="ayuda-grupo" hidden>Presenta este QR en recepción. Pueden llegar por separado y mostrar el mismo pase.</p>
  <a class="volver" href="/">Volver a la invitación</a>
</main>
<script src="pase-grupo.js" type="module"></script>
</body>
</html>
